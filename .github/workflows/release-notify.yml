name: Notify Telegram on Release

# Posts a message to the Telegram groups when a release is published.
# The packages are attached by the build workflows a few minutes after publishing, so this waits
# for them (up to 40 minutes) and then posts the download links that exist.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TG_BOT_TOKEN  token of the Telegram bot (the bot must be a member of every group)
#   TG_CHATS      comma-separated chats: "chat_id" or "chat_id:topic_id" for a forum topic,
#                 e.g. "-1001234567890,-1009876543210:42"
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce, e.g. v2.0.9 or android-v1.1.1 (posts to all groups)
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHATS: ${{ secrets.TG_CHATS }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Wait for the release packages
        run: |
          if [[ "$RELEASE_TAG" == android-* ]]; then
            expected=(TuxPlayerX-android.apk)
          else
            expected=(TuxPlayerXSetup.exe TuxPlayerX_amd64.deb TuxPlayerX_x86_64.rpm)
          fi
          for attempt in $(seq 1 80); do
            assets=$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
            missing=0
            for name in "${expected[@]}"; do grep -qx "$name" <<< "$assets" || missing=1; done
            [ "$missing" = 0 ] && { echo "All packages are attached."; exit 0; }
            echo "Waiting for packages ($attempt/80)..."
            sleep 30
          done
          echo "::warning::Not every package was attached in time; announcing the ones that exist."

      - name: Send Telegram notifications
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHATS" ]; then
            echo "::error::TG_BOT_TOKEN or TG_CHATS is not set."
            exit 1
          fi

          release=$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json name,url,assets)
          name=$(jq -r '.name // empty' <<< "$release")
          url=$(jq -r '.url' <<< "$release")
          asset_url() { jq -r --arg n "$1" '.assets[] | select(.name == $n) | .url' <<< "$release"; }
          link() { local u; u=$(asset_url "$1"); if [ -n "$u" ]; then printf '\n⬇️ <a href="%s">%s</a>' "$u" "$2"; fi; }

          if [[ "$RELEASE_TAG" == android-* ]]; then
            TEXT="📢 <b>TuxPlayerX pentru Android are o nouă versiune!</b>
          <b>${name:-$RELEASE_TAG}</b> (tag: <code>${RELEASE_TAG}</code>)

          👉 Player IPTV pentru telefoane, tablete și Android TV: liste M3U, abonamente MAC portal, ghid TV și catch-up.
          Cod gratuit și open source, fără reclame sau spyware.

          👉 <a href=\"${url}\">Mergi la pagina noii versiuni</a>$(link TuxPlayerX-android.apk 'Descarcă APK-ul')"
          else
            TEXT="📢 <b>TuxPlayerX are o nouă versiune pe GitHub!</b>
          <b>${name:-$RELEASE_TAG}</b> (tag: <code>${RELEASE_TAG}</code>)

          👉 Player IPTV pentru Linux și Windows: liste M3U, abonamente MAC portal, ghid TV, filme și seriale.
          Cod gratuit și open source, fără reclame sau spyware.

          👉 <a href=\"${url}\">Mergi la pagina noii versiuni</a>$(link TuxPlayerXSetup.exe 'Windows (.exe)')$(link TuxPlayerX_amd64.deb 'Linux Debian/Ubuntu/Mint (.deb)')$(link TuxPlayerX_x86_64.rpm 'Linux Fedora/openSUSE (.rpm)')"
          fi

          failed=0
          IFS=',' read -r -a CHATS <<< "$TG_CHATS"
          for item in "${CHATS[@]}"; do
            item=$(xargs <<< "$item")
            [ -z "$item" ] && continue
            args=(-d parse_mode=HTML -d disable_web_page_preview=true --data-urlencode "text=${TEXT}")
            if [[ "$item" == *:* ]]; then
              args+=(-d "chat_id=${item%%:*}" -d "message_thread_id=${item##*:}")
            else
              args+=(-d "chat_id=${item}")
            fi
            response=$(curl -sS "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" "${args[@]}")
            if jq -e '.ok' <<< "$response" > /dev/null; then
              echo "Sent to ${item}"
            else
              echo "::warning::Sending to ${item} failed: $(jq -r '.description // .' <<< "$response")"
              failed=1
            fi
          done
          exit $failed
