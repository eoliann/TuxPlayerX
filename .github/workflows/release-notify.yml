name: Notify Telegram on Release

# Posts a message to the Telegram groups when a release is published.
# The packages are attached by the build workflows a few minutes after publishing, so this waits
# for them (up to 40 minutes) and then posts the download links that exist.
#
# Secrets (Settings → Secrets and variables → Actions). Each chat list is comma-separated, with
# entries "chat_id" or "chat_id:topic_id" for a forum topic, e.g. "-1001234567890,-1009876543210:42".
#   TG_BOT_TOKEN      token of the Telegram bot (the bot must be a member of every group)
#   TG_CHATS          chats that get every release, with all download links
#   TG_CHATS_WINDOWS  chats that get desktop releases (vX.Y.Z) with the Windows installer
#   TG_CHATS_LINUX    chats that get desktop releases (vX.Y.Z) with the .deb and .rpm packages
#   TG_CHATS_ANDROID  chats that get Android releases (android-vX.Y.Z) with the APK
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce, e.g. v2.0.9 or android-v1.1.1 (posts to all its groups)
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHATS: ${{ secrets.TG_CHATS }}
      TG_CHATS_WINDOWS: ${{ secrets.TG_CHATS_WINDOWS }}
      TG_CHATS_LINUX: ${{ secrets.TG_CHATS_LINUX }}
      TG_CHATS_ANDROID: ${{ secrets.TG_CHATS_ANDROID }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Wait for the release packages
        run: |
          if [[ "$RELEASE_TAG" == android-* ]]; then
            expected=(TuxPlayerX-android.apk)
          else
            expected=(TuxPlayerXSetup.exe TuxPlayerX_amd64.deb TuxPlayerX_x86_64.rpm)
          fi
          for attempt in $(seq 1 80); do
            assets=$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
            missing=0
            for name in "${expected[@]}"; do grep -qx "$name" <<< "$assets" || missing=1; done
            [ "$missing" = 0 ] && { echo "All packages are attached."; exit 0; }
            echo "Waiting for packages ($attempt/80)..."
            sleep 30
          done
          echo "::warning::Not every package was attached in time; announcing the ones that exist."

      - name: Send Telegram notifications
        run: |
          if [ -z "$TG_BOT_TOKEN" ]; then
            echo "::error::TG_BOT_TOKEN is not set."
            exit 1
          fi

          release=$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json name,url,assets)
          name=$(jq -r '.name // empty' <<< "$release")
          url=$(jq -r '.url' <<< "$release")
          asset_url() { jq -r --arg n "$1" '.assets[] | select(.name == $n) | .url' <<< "$release"; }
          link() { local u; u=$(asset_url "$1"); if [ -n "$u" ]; then printf '\n⬇️ <a href="%s">%s</a>' "$u" "$2"; fi; }

          # message <title> <description> <download links>
          message() {
            printf '📢 <b>%s</b>\n<b>%s</b> (tag: <code>%s</code>)\n\n👉 %s\nCod gratuit și open source, fără reclame sau spyware.\n\n👉 <a href="%s">Mergi la pagina noii versiuni</a>%s' \
              "$1" "${name:-$RELEASE_TAG}" "$RELEASE_TAG" "$2" "$url" "$3"
          }

          failed=0
          sent=0
          # send <comma-separated chats> <text>
          send() {
            local item args response
            IFS=',' read -r -a chats <<< "$1"
            for item in "${chats[@]}"; do
              item=$(xargs <<< "$item")
              [ -z "$item" ] && continue
              args=(-d parse_mode=HTML -d disable_web_page_preview=true --data-urlencode "text=$2")
              if [[ "$item" == *:* ]]; then
                args+=(-d "chat_id=${item%%:*}" -d "message_thread_id=${item##*:}")
              else
                args+=(-d "chat_id=${item}")
              fi
              # -g: no URL globbing, so stray [ ] { } in the token cannot abort the run.
              # A curl failure is reported for this chat and the remaining chats are still sent.
              response=$(curl -sSg --max-time 30 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" "${args[@]}") \
                || response=$(jq -n --arg d "request failed (curl exit $?)" '{ok: false, description: $d}')
              if jq -e '.ok' <<< "$response" > /dev/null 2>&1; then
                echo "Sent to ${item}"
                sent=$((sent + 1))
              else
                echo "::warning::Sending to ${item} failed: $(jq -r '.description // .' <<< "$response" 2>/dev/null || head -c 200 <<< "$response")"
                failed=1
              fi
            done
          }

          if [[ "$RELEASE_TAG" == android-* ]]; then
            apk=$(link TuxPlayerX-android.apk 'Descarcă APK-ul')
            text=$(message 'TuxPlayerX pentru Android are o nouă versiune!' \
              'Player IPTV pentru telefoane, tablete și Android TV: liste M3U, abonamente MAC portal, ghid TV și catch-up.' "$apk")
            send "$TG_CHATS_ANDROID" "$text"
            send "$TG_CHATS" "$text"
          else
            exe=$(link TuxPlayerXSetup.exe 'Windows (.exe)')
            linux="$(link TuxPlayerX_amd64.deb 'Linux Debian/Ubuntu/Mint (.deb)')$(link TuxPlayerX_x86_64.rpm 'Linux Fedora/openSUSE (.rpm)')"
            send "$TG_CHATS_WINDOWS" "$(message 'TuxPlayerX pentru Windows are o nouă versiune!' \
              'Player IPTV pentru Windows: liste M3U, abonamente MAC portal, ghid TV, filme și seriale.' "$exe")"
            send "$TG_CHATS_LINUX" "$(message 'TuxPlayerX pentru Linux are o nouă versiune!' \
              'Player IPTV pentru Linux: liste M3U, abonamente MAC portal, ghid TV, filme și seriale.' "$linux")"
            send "$TG_CHATS" "$(message 'TuxPlayerX are o nouă versiune pe GitHub!' \
              'Player IPTV pentru Linux și Windows: liste M3U, abonamente MAC portal, ghid TV, filme și seriale.' "$exe$linux")"
          fi

          if [ "$sent" = 0 ] && [ "$failed" = 0 ]; then
            echo "::error::No Telegram chats are configured for this release."
            exit 1
          fi
          exit $failed
