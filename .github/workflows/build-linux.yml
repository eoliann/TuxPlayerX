name: Build Linux packages

# Runs automatically when a GitHub release is published and attaches the packages to it as
# TuxPlayerX_amd64.deb and TuxPlayerX_x86_64.rpm. It can also be run manually from the Actions tab;
# give a release tag (for example v2.0.6) to build that tag and attach the packages to its release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the packages to (leave empty to only build)
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    # Android releases (android-v*) are built by build-android.yml.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.release.tag_name, 'android-')
    # Built on the oldest supported Ubuntu so the packages also run on older glibc-based distros.
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build DEB and RPM packages
        run: npm run tauri:build -- --bundles deb,rpm

      - name: Rename packages
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          rpm=$(ls src-tauri/target/release/bundle/rpm/*.rpm | head -n 1)
          test -n "$deb" && test -n "$rpm" || { echo "DEB or RPM package was not produced"; exit 1; }
          cp "$deb" TuxPlayerX_amd64.deb
          cp "$rpm" TuxPlayerX_x86_64.rpm
          echo "Built $(basename "$deb") and $(basename "$rpm")"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TuxPlayerX-linux
          path: |
            TuxPlayerX_amd64.deb
            TuxPlayerX_x86_64.rpm

      - name: Attach packages to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TuxPlayerX_amd64.deb TuxPlayerX_x86_64.rpm --clobber
