name: Build Linux packages

# Runs automatically when a GitHub release is published and attaches the packages to it as
# DEB, RPM and Arch packages. It can also be run manually from the Actions tab;
# give a release tag (for example v2.0.6) to build that tag and attach the packages to its release.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-linux.yml'
      - 'packaging/**'
      - 'scripts/package-arch.sh'
      - 'src-tauri/tauri.conf.json'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the packages to (leave empty to only build)
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    # Android releases (android-v*) are built by build-android.yml.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.release.tag_name, 'android-')
    # Built on the oldest supported Ubuntu so the packages also run on older glibc-based distros.
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build DEB and RPM packages
        run: npm run tauri:build -- --bundles deb,rpm

      - name: Rename packages
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          rpm=$(ls src-tauri/target/release/bundle/rpm/*.rpm | head -n 1)
          test -n "$deb" && test -n "$rpm" || { echo "DEB or RPM package was not produced"; exit 1; }
          cp "$deb" TuxPlayerX_amd64.deb
          cp "$rpm" TuxPlayerX_x86_64.rpm
          echo "Built $(basename "$deb") and $(basename "$rpm")"

      - name: Build Arch package
        if: hashFiles('packaging/arch/PKGBUILD.in') != ''
        run: bash scripts/package-arch.sh

      - name: Verify installation and removal on Debian, Fedora and Arch
        if: hashFiles('packaging/linux/com.eoliann.tuxplayerx.metainfo.xml') != ''
        run: |
          verify_uninstall() {
            local image="$1" package="$2"
            test -f "$package"
            docker run --rm --mount "type=bind,src=$PWD/$package,dst=/packages/$(basename "$package"),readonly" \
              "$image" bash -euc '
                package="$1"
                case "$2" in
                  debian:*)
                    apt-get update
                    apt-get install -y "$package"
                    remove=(apt-get remove -y tux-player-x)
                    ;;
                  fedora:*)
                    dnf install -y "$package"
                    remove=(dnf remove -y tux-player-x)
                    ;;
                  archlinux:*)
                    pacman -Syu --noconfirm
                    pacman -U --noconfirm "$package"
                    remove=(pacman -R --noconfirm tuxplayerx-bin)
                    ;;
                esac
                binary=/usr/bin/tuxplayerx
                launcher=/usr/share/applications/TuxPlayerX.desktop
                metadata=/usr/share/metainfo/com.eoliann.tuxplayerx.metainfo.xml
                test -x "$binary"
                test -f "$launcher"
                grep -F "<launchable type=\"desktop-id\">TuxPlayerX.desktop</launchable>" "$metadata"
                "${remove[@]}"
                test ! -e "$binary"
                test ! -e "$launcher"
                test ! -e "$metadata"
              ' -- "/packages/$(basename "$package")" "$image"
          }

          verify_uninstall debian:12 TuxPlayerX_amd64.deb
          verify_uninstall fedora:latest TuxPlayerX_x86_64.rpm
          verify_uninstall archlinux:latest arch-output/*.pkg.tar.zst

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TuxPlayerX-linux
          path: |
            TuxPlayerX_amd64.deb
            TuxPlayerX_x86_64.rpm
            arch-output/*

      - name: Attach packages to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "$RELEASE_TAG" TuxPlayerX_amd64.deb TuxPlayerX_x86_64.rpm arch-output/* --clobber
