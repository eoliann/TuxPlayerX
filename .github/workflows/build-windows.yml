name: Build Windows installer

# Run manually from the Actions tab, or automatically when a GitHub release is published
# (the installer is then attached to that release as TuxPlayerXSetup.exe).
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run tauri:build -- --bundles nsis

      - name: Rename installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer was not produced" }
          Copy-Item $exe.FullName TuxPlayerXSetup.exe
          Write-Host "Built $($exe.Name)"

      - uses: actions/upload-artifact@v4
        with:
          name: TuxPlayerXSetup
          path: TuxPlayerXSetup.exe

      - name: Attach installer to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" TuxPlayerXSetup.exe --clobber
