name: Build Android APK

# Android has its own releases, tagged android-vX.Y.Z (the PC app uses vX.Y.Z).
# Runs automatically when such a release is published and attaches TuxPlayerX-android.apk to it.
# It can also be run manually from the Actions tab; give a release tag to attach the APK to that release.
#
# Signing secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  the release keystore (.jks), base64 encoded
#   ANDROID_KEY_ALIAS        key alias inside the keystore
#   ANDROID_KEY_PASSWORD     keystore and key password
# Without them the APK is signed with a throwaway debug key (fine for testing, not for releases).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Android release tag to build and attach the APK to, e.g. android-v1.0.0 (leave empty to only build)
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'android-')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners ship the Android SDK and NDK; use them directly.
      - name: Use the preinstalled Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # A release must never ship an APK signed with a throwaway key.
            if [ -n "$RELEASE_TAG" ]; then echo "::error::Signing secrets are missing; refusing to build a release APK."; exit 1; fi
            echo "::warning::Signing secrets are not set; the APK is signed with a debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "keyAlias=$KEY_ALIAS"
            echo "password=$KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties

      # ARM for phones, tablets and TVs; x86_64 for the Android emulator.
      - name: Build APK
        run: npx tauri android build --apk --target aarch64 --target armv7 --target x86_64

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" src-tauri/gen/android/keystore.properties

      - name: Rename APK
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          test -n "$apk" || { echo "APK was not produced"; exit 1; }
          cp "$apk" TuxPlayerX-android.apk
          echo "Built $apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TuxPlayerX-android
          path: TuxPlayerX-android.apk

      - name: Attach APK to release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" TuxPlayerX-android.apk --clobber
