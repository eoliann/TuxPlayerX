[package]
name = "tuxplayerx"
version = "2.0.9"
description = "TuxPlayerX desktop streaming player"
authors = ["eoliann"]
edition = "2021"
# 1.77.2+ quotes arguments safely when the external player is a .bat/.cmd file (CVE-2024-24576).
rust-version = "1.77.2"
license = "MIT"

# The app is built as a library so the same code also runs as the Android app.
[lib]
name = "tuxplayerx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
urlencoding = "2"
dirs-next = "2"
anyhow = "1"
open = "5"
sha2 = "0.10"
roxmltree = "0.20"
flate2 = "1"
tokio = { version = "1", features = ["sync", "rt", "time", "net", "io-util"] }
tauri-plugin-dialog = "2"
# OS random generator for local server tokens.
getrandom = "0.2"
base64 = "0.22"

# Credentials are encrypted at rest with the Windows Data Protection API (tied to the user account).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
